version: "1.0.0"
category: hardcode_cred
rules:
  - {id: HCRED-001, title: shadow 文件中的弱口令哈希, severity: high, scene: 系统账户文件, match_type: regex, pattern: '(?P<secret>\$1\$[./A-Za-z0-9]{1,8}\$[./A-Za-z0-9]{22})', paths: ['**/shadow', etc/shadow], file_types: [text], mask: true, tags: [password_hash], description: 账户密码使用 MD5 crypt 弱哈希保存，容易被离线暴力破解。, remediation: 改用强哈希算法，禁用默认账户并强制首次登录修改密码。}
  - {id: HCRED-002, title: 二进制或脚本中的硬编码管理员密码, severity: high, scene: 固件可执行文件与启动脚本, match_type: regex, pattern: '(?i)\b(?:admin|root|debug|backup|service)[_-]?(?:password|passwd|pwd|pass)\s*=\s*(?P<secret>[A-Za-z0-9!@#%^&*._+-]{6,64})', mask: true, tags: [embedded_password], description: 文件内直接保存管理员密码，提取固件后即可获得设备控制凭证。, remediation: 移除硬编码密码，采用首次启动随机生成或安全密钥注入机制。}
  - {id: HCRED-003, title: 数据库或中间件连接串凭证, severity: high, scene: 配置与脚本文件, match_type: regex, pattern: '(?i)\b(?:mysql|mariadb|postgres(?:ql)?|mongodb(?:\+srv)?|redis|amqp)://[^:\s/@]+:(?P<secret>[^@\s]{4,})@', file_types: [text], mask: true, tags: [connection_string], description: 连接串中包含明文数据库账号密码，可被直接用于访问后端服务。, remediation: 使用受限服务账户和密钥管理机制，禁止在固件中保存明文连接凭证。}
  - {id: HCRED-004, title: 云服务 AccessKey 特征, severity: high, scene: 应用配置与脚本, match_type: regex, pattern: '(?i)\b(?:AKIA|ASIA)(?P<secret>[A-Z0-9]{16})\b', file_types: [text], mask: true, tags: [cloud_key], description: 发现疑似云平台长期访问密钥，可能导致云资源被未授权访问。, remediation: 立即吊销密钥，改用临时凭证或设备唯一证书。}
  - {id: HCRED-005, title: 硬编码私钥文件, severity: high, scene: 证书与密钥目录, match_type: regex, pattern: 'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY', paths: ['**/*.pem', '**/*.key', '**/*.p12', '**/certs/**'], file_types: [text], mask: true, tags: [private_key], description: 固件中内置私钥，攻击者可提取后伪造身份或解密通信。, remediation: 每台设备生成独立密钥，禁止将同一私钥打包进量产固件。}
  - {id: HCRED-006, title: 通用 IoT 设备弱口令赋值, severity: high, scene: 配置文件与启动脚本, match_type: regex, pattern: '(?i)(?:\bpassword|\bpasswd|\bpwd|\bpass)\s*[:=]\s*["'']?(?P<secret>\s*(?:admin|administrator|root|toor|password|passwd|pass|123456|12345678|123456789|12345|1234|111111|000000|666666|888888|123123|654321|qwerty|qwerty123|qwertyuiop|abc123|abcd1234|admin123|admin888|administrator123|root123|root1234|password123|password1|passw0rd|p@ssw0rd|P@ssw0rd|P@ssword123|letmein|welcome|welcome123|guest|guest123|default|default123|changeme|changeit|support|service|user|test|test123|demo|demo123|temp|temp123|master|secret|secret123|superuser|supervisor|system|manager|operator|operator123|public|private|access|login|login123|connect|backup|adminadmin|rootroot|1q2w3e4r|1qaz2wsx|qazwsx|zaq12wsx|asdfgh|asdfghjkl|zxcvbn|zxcvbnm|iloveyou|monkey|dragon|sunshine|princess|football|baseball|shadow|michael|jennifer|trustno1|whatever|yes|no|on|off|enable|enabled|open|free|88888888|999999|666888|520520|1314520|woaini|woaini1314|123qwe|qwe123|qweasd|qweasdzxc|a123456|a123456789|123abc|abc12345|112233|121212|147258|159357|2580|0000|1111|2222|3333|555555|777777|admin@123|root@123|user@123|admin#123|Admin123))\s*(?=$|["''\s;])', file_types: [text], mask: true, tags: [weak_password, sig_130], description: 命中通用弱口令特征库，设备可能使用默认账户即可登录。, remediation: 强制修改默认密码，首次启动要求设置高强度唯一口令。}
  - {id: HCRED-007, title: API 密钥或令牌明文赋值, severity: high, scene: 应用配置与脚本, match_type: regex, pattern: '(?i)\b(?:api[_-]?key|access[_-]?key|secret[_-]?key|auth[_-]?token)\s*[:=]\s*["'']?(?P<secret>[A-Za-z0-9._~+/-]{8,})', file_types: [text], mask: true, tags: [api_key], description: API 密钥或令牌以明文形式写入固件，存在凭证泄露风险。, remediation: 使用设备级临时凭证，避免在文件中保存长期有效密钥。}
  - {id: HCRED-008, title: JWT 令牌硬编码, severity: medium, scene: Web 应用配置, match_type: regex, pattern: '(?P<secret>eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,})', file_types: [text], mask: true, tags: [jwt_token], description: 发现硬编码 JWT 令牌，可能被用于绕过身份认证。, remediation: 移除固定令牌，使用短有效期令牌并校验签名。}
  - {id: HCRED-009, title: 默认 FTP 明文口令配置, severity: medium, scene: 服务配置文件, match_type: regex, pattern: '(?i)^\s*(?:ftp[_-]?user|ftp[_-]?password)\s*[:=]\s*(?P<secret>\S+)', paths: ['**/ftp*', '**/vsftpd.conf', '**/proftpd.conf'], file_types: [text], mask: true, tags: [default_credential], description: FTP 服务配置中保存明文账户口令。, remediation: 禁用匿名 FTP，使用加密协议与随机强口令。}
