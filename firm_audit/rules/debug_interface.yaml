version: "1.0.0"
category: debug_interface
rules:
  - {id: DBG-001, title: 系统账户文件中的默认测试账户, severity: high, scene: 账户文件, match_type: regex, pattern: '^(?:test|debug|support|guest|default):[^:]*:0:', paths: ['**/passwd'], file_types: [text], tags: [account], metadata: {access_method: 本地登录或 SSH 登录, potential_impact: 测试账户具有 root 权限，可完全控制设备}, description: 账户文件中存在默认或测试特权账户，通常使用弱口令或空口令。, remediation: 删除测试账户，生产固件仅保留必要账户并强制强口令。}
  - {id: DBG-002, title: 启动脚本默认开启 Telnet 服务, severity: high, scene: 系统启动脚本, match_type: regex, pattern: '(?i)(?:\btelnetd\b|busybox\s+telnetd)', paths: ['**/init.d/*', '**/rc.d/*', '**/rc*.d/*'], file_types: [text], tags: [service], metadata: {access_method: TCP 23 端口远程登录, potential_impact: Telnet 明文传输且常绕过认证，可被局域网攻击者接管设备}, description: 系统启动时自动启动 Telnet 服务，调试接口未在发布前移除。, remediation: 移除 Telnet 启动项，改用 SSH 并限制管理网段访问。}
  - {id: DBG-003, title: 二进制中的 ADB 调试后门特征, severity: high, scene: 固件可执行文件, match_type: regex, pattern: '(?i)(?:adb|debug)[_-]?(?:backdoor|shell|listen|daemon)', file_types: [binary], tags: [binary], metadata: {access_method: ADB 或自定义调试端口连接, potential_impact: 可能直接获得 shell 权限并执行任意命令}, description: 二进制内包含 ADB 调试或后门监听特征，发布固件不应保留。, remediation: 删除调试二进制及启动项，关闭量产固件的 ADB 接口。}
  - {id: DBG-004, title: Web 目录遗留调试测试页面, severity: medium, scene: Web 根目录, match_type: regex, pattern: '(?i)(?:phpinfo\s*\(|debug_test|DEBUG_MODE\s*=\s*true|test_debug)', paths: ['**/www/**', '**/htdocs/**', '**/webroot/**'], file_types: [text], tags: [web], metadata: {access_method: HTTP 页面直接访问, potential_impact: 泄露运行环境、配置与内部路径，可能被进一步利用}, description: Web 根目录存在调试或测试页面，未在固件发布前清理。, remediation: 删除测试页面与调试开关，仅发布经审核的生产页面。}
  - {id: DBG-005, title: 账户文件中的匿名 FTP 账户, severity: high, scene: 账户文件, match_type: regex, pattern: '^(?:anonymous|ftp):[^:]*:', paths: ['**/passwd'], file_types: [text], tags: [account], metadata: {access_method: FTP 匿名登录, potential_impact: 未授权用户可读取或写入文件}, description: 账户文件中保留匿名 FTP 账户，攻击者可能未授权访问文件系统。, remediation: 删除匿名账户并禁用 FTP 匿名访问。}
  - {id: DBG-006, title: 串口控制台自动登录配置, severity: high, scene: 启动配置, match_type: regex, pattern: '(?i)ttyS\d+::respawn:.*(?:/bin/sh|login)', paths: ['**/inittab', '**/init/*'], file_types: [text], tags: [service], metadata: {access_method: 物理串口控制台, potential_impact: 攻击者可通过串口获得无需认证的 shell}, description: 串口控制台配置为自动启动 shell 或登录程序。, remediation: 移除自动登录，启用控制台认证并限制物理接口。}
  - {id: DBG-007, title: 系统属性开启可调试模式, severity: medium, scene: 系统属性文件, match_type: regex, pattern: '(?i)^(?:ro\.)?debuggable\s*=\s*1|service\.adb\.root\s*=\s*1', paths: ['**/build.prop', '**/prop.default'], file_types: [text], tags: [binary], metadata: {access_method: 调试桥与系统属性读取, potential_impact: 调试能力可能被用于提权与数据提取}, description: 系统属性启用调试模式或 ADB root。, remediation: 发布固件关闭 debuggable 与 adb root 属性。}
  - {id: DBG-008, title: 启动脚本中的调试 shell 后门, severity: high, scene: 系统启动脚本, match_type: regex, pattern: '(?i)\b(?:debug_shell|backdoor_shell|shell_backdoor)\b', paths: ['**/init.d/*', '**/rc.d/*'], file_types: [text], tags: [service], metadata: {access_method: 网络或本地命令触发, potential_impact: 可直接执行任意系统命令}, description: 启动脚本包含调试 shell 或后门命令特征。, remediation: 删除后门脚本并复核启动项完整性。}
  - {id: DBG-009, title: 遗留 phpinfo 或探针页面, severity: medium, scene: Web 根目录, match_type: path, pattern: '**/phpinfo.php', paths: ['**/phpinfo.php', '**/info.php', '**/debug.php'], tags: [web], metadata: {access_method: HTTP 直接访问, potential_impact: 暴露服务器环境变量、路径与敏感配置}, description: Web 根目录存在探针或调试脚本文件。, remediation: 删除探针文件并禁止生产环境开放调试入口。}
  - {id: DBG-010, title: 二进制中的反弹 shell 特征, severity: high, scene: 固件可执行文件, match_type: regex, pattern: '(?i)(?:reverse_shell|nc\s+-e\s+/bin/sh|/bin/sh\s+-i)', file_types: [binary], tags: [binary], metadata: {access_method: 攻击者预设命令或远程触发, potential_impact: 可能获得交互式远程 shell}, description: 二进制中包含反弹 shell 或交互式 shell 特征。, remediation: 排查并删除可疑二进制，发布前进行二进制来源审计。}
  - {id: DBG-011, title: SSH 免密调试授权, severity: high, scene: SSH 账户目录, match_type: path, pattern: '**/authorized_keys', paths: ['**/authorized_keys'], tags: [account], metadata: {access_method: SSH 公钥免密登录, potential_impact: 内置公钥允许持有对应私钥者直接登录设备}, description: 固件内保留 authorized_keys，可能形成隐藏的免密登录通道。, remediation: 清理发布固件中的免密公钥，使用设备唯一密钥并按需授权。}
  - {id: DBG-012, title: 调试服务开机自启配置, severity: medium, scene: 启动服务目录, match_type: regex, pattern: '(?i)(?:^|\s)(?:debugd|adbd|ftpd)\s+(?:start|enable)', paths: ['**/init.d/*', '**/rc.local', '**/systemd/**'], file_types: [text], tags: [service], metadata: {access_method: 网络调试协议, potential_impact: 调试守护进程暴露可被利用的管理接口}, description: 启动配置主动开启调试或文件传输守护进程。, remediation: 移除量产固件中的调试服务自启项并关闭对应端口。}
