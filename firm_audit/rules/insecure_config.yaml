version: "1.0.0"
category: insecure_config
rules:
  - {id: CONF-001, title: SSH 允许 root 直接登录, severity: high, scene: SSH 服务配置, match_type: regex, pattern: '(?i)^\s*PermitRootLogin\s+yes\s*(?:#.*)?$', paths: ['**/sshd_config', '**/ssh_config'], file_types: [text], tags: [ssh], description: SSH 允许 root 用户直接登录，暴力破解成功后可直接获得最高权限。, remediation: 设置 PermitRootLogin no，使用普通账户登录后再提权。}
  - {id: CONF-002, title: SSH 允许空密码登录, severity: high, scene: SSH 服务配置, match_type: regex, pattern: '(?i)^\s*PermitEmptyPasswords\s+yes\s*(?:#.*)?$', paths: ['**/sshd_config', '**/ssh_config'], file_types: [text], tags: [ssh], description: SSH 允许空密码账户登录，默认或测试账户可能被直接利用。, remediation: 设置 PermitEmptyPasswords no，并锁定空密码账户。}
  - {id: CONF-003, title: SSH 开启密码认证, severity: medium, scene: SSH 服务配置, match_type: regex, pattern: '(?i)^\s*PasswordAuthentication\s+yes\s*(?:#.*)?$', paths: ['**/sshd_config', '**/ssh_config'], file_types: [text], tags: [ssh], description: SSH 密码认证可被在线暴力破解，弱口令风险较高。, remediation: 优先使用密钥认证，并配合登录失败锁定与来源限制。}
  - {id: CONF-004, title: SSH 启用过期协议版本, severity: high, scene: SSH 服务配置, match_type: regex, pattern: '(?i)^\s*Protocol\s+1\s*(?:#.*)?$', paths: ['**/sshd_config'], file_types: [text], tags: [ssh], description: SSH 协议版本 1 存在已知设计缺陷，不应在生产环境中启用。, remediation: 仅允许 SSH 协议版本 2。}
  - {id: CONF-005, title: SSH 开启 X11 转发, severity: low, scene: SSH 服务配置, match_type: regex, pattern: '(?i)^\s*X11Forwarding\s+yes\s*(?:#.*)?$', paths: ['**/sshd_config'], file_types: [text], tags: [ssh], description: X11 转发扩大攻击面，嵌入式设备通常无需开启。, remediation: 设置 X11Forwarding no。}
  - {id: CONF-006, title: SSH 开启 TCP 转发, severity: medium, scene: SSH 服务配置, match_type: regex, pattern: '(?i)^\s*AllowTcpForwarding\s+yes\s*(?:#.*)?$', paths: ['**/sshd_config'], file_types: [text], tags: [ssh], description: TCP 转发可将设备作为内网跳板，增加横向移动风险。, remediation: 设置 AllowTcpForwarding no，按需限制转发目标。}
  - {id: CONF-007, title: SSH 关闭严格模式, severity: medium, scene: SSH 服务配置, match_type: regex, pattern: '(?i)^\s*StrictModes\s+no\s*(?:#.*)?$', paths: ['**/sshd_config'], file_types: [text], tags: [ssh], description: 关闭 StrictModes 后，权限错误的密钥文件仍可能被使用。, remediation: 设置 StrictModes yes 并修复密钥文件权限。}
  - {id: CONF-008, title: SSH 禁用 PAM, severity: low, scene: SSH 服务配置, match_type: regex, pattern: '(?i)^\s*UsePAM\s+no\s*(?:#.*)?$', paths: ['**/sshd_config'], file_types: [text], tags: [ssh], description: 禁用 PAM 可能绕过账户锁定与认证审计策略。, remediation: 在支持的系统中启用 UsePAM yes 并配置登录策略。}
  - {id: CONF-009, title: SSH 认证尝试次数过高, severity: medium, scene: SSH 服务配置, match_type: regex, pattern: '(?i)^\s*MaxAuthTries\s+(?:[7-9]|[1-9]\d+)\s*(?:#.*)?$', paths: ['**/sshd_config'], file_types: [text], tags: [ssh], description: 允许过多认证尝试会增加在线暴力破解成功率。, remediation: 将 MaxAuthTries 限制为较小值，并启用失败锁定。}
  - {id: CONF-010, title: SSH 允许用户环境变量注入, severity: medium, scene: SSH 服务配置, match_type: regex, pattern: '(?i)^\s*PermitUserEnvironment\s+yes\s*(?:#.*)?$', paths: ['**/sshd_config'], file_types: [text], tags: [ssh], description: 允许用户环境文件可能注入危险变量影响会话安全。, remediation: 设置 PermitUserEnvironment no。}
  - {id: CONF-011, title: inetd 启用 Telnet 服务, severity: high, scene: 网络服务配置, match_type: regex, pattern: '(?i)^\s*telnet\s+stream\s+tcp\s+nowait\s+\S+\s+\S*telnetd', paths: ['**/inetd.conf', '**/xinetd.conf'], file_types: [text], tags: [telnet], description: inetd 配置启用 Telnet 守护进程，服务使用明文传输。, remediation: 注释 Telnet 服务项，改用 SSH 并限制管理来源。}
  - {id: CONF-012, title: xinetd 未禁用 Telnet 服务, severity: high, scene: 网络服务配置, match_type: regex, pattern: '(?i)^\s*disable\s*=\s*no\s*(?:#.*)?$', paths: ['**/xinetd.d/telnet', '**/xinetd.d/*telnet*'], file_types: [text], tags: [telnet], description: xinetd 的 Telnet 服务未禁用，可能暴露明文管理入口。, remediation: 设置 disable = yes 或删除服务配置。}
  - {id: CONF-013, title: FTP 允许匿名访问, severity: high, scene: FTP 服务配置, match_type: regex, pattern: '(?i)^\s*anonymous_enable\s*=\s*YES\s*$', paths: ['**/vsftpd.conf', '**/proftpd.conf', '**/ftp*.conf'], file_types: [text], tags: [ftp], description: FTP 匿名访问可导致文件被未授权读取或写入。, remediation: 设置 anonymous_enable=NO，并使用加密文件传输方式。}
  - {id: CONF-014, title: FTP 开启全局写权限, severity: high, scene: FTP 服务配置, match_type: regex, pattern: '(?i)^\s*(?:write_enable|anon_upload_enable)\s*=\s*YES\s*$', paths: ['**/vsftpd.conf', '**/proftpd.conf', '**/ftp*.conf'], file_types: [text], tags: [ftp], description: FTP 写权限可能允许攻击者上传后门或篡改固件文件。, remediation: 关闭不必要的写权限，限制可写目录并启用传输加密。}
  - {id: CONF-015, title: 防火墙默认允许所有入站流量, severity: high, scene: 防火墙配置, match_type: regex, pattern: '(?i)^\s*DEFAULT_(?:INPUT|INBOUND)_POLICY\s*=\s*ACCEPT\s*$', paths: ['**/firewall.conf', '**/firewall.rules', '**/iptables.rules'], file_types: [text], tags: [firewall], description: 防火墙默认接受所有入站连接，设备服务会直接暴露。, remediation: 将默认策略改为 DROP，仅放行明确需要的管理端口。}
  - {id: CONF-016, title: 防火墙默认允许转发流量, severity: medium, scene: 防火墙配置, match_type: regex, pattern: '(?i)^\s*DEFAULT_FORWARD_POLICY\s*=\s*ACCEPT\s*$', paths: ['**/firewall.conf', '**/firewall.rules', '**/iptables.rules'], file_types: [text], tags: [firewall], description: 默认转发策略为接受，设备可能被用作网络跳板。, remediation: 设置默认转发策略为 DROP，并明确配置必要的转发规则。}
  - {id: CONF-017, title: IPv6 防火墙默认放行, severity: medium, scene: 防火墙配置, match_type: regex, pattern: '(?i)^\s*DEFAULT_(?:INPUT|FORWARD)_POLICY\s*=\s*ACCEPT\s*$', paths: ['**/ip6tables.rules', '**/firewall6.conf', '**/ip6tables.conf'], file_types: [text], tags: [firewall], description: IPv6 默认策略过于宽松，可能绕过仅针对 IPv4 的访问限制。, remediation: 为 IPv6 配置与 IPv4 一致的默认拒绝策略。}
  - {id: CONF-018, title: iptables 允许所有入站连接, severity: high, scene: 防火墙配置, match_type: regex, pattern: '(?i)^\s*-A\s+INPUT\s+-j\s+ACCEPT\s*$', paths: ['**/iptables.rules', '**/firewall.rules', '**/rc.local'], file_types: [text], tags: [firewall], description: iptables 规则对全部入站流量执行 ACCEPT，限制形同虚设。, remediation: 删除全放行规则，按最小权限配置端口白名单。}
  - {id: CONF-019, title: Nginx 开启目录列表, severity: medium, scene: Web 服务配置, match_type: regex, pattern: '(?i)^\s*autoindex\s+on\s*;', paths: ['**/nginx.conf', '**/conf.d/**', '**/sites-enabled/**'], file_types: [text], tags: [web], description: Web 服务允许目录列表，可能泄露固件文件与内部结构。, remediation: 设置 autoindex off，并对敏感目录增加访问控制。}
  - {id: CONF-020, title: Nginx 暴露版本信息, severity: low, scene: Web 服务配置, match_type: regex, pattern: '(?i)^\s*server_tokens\s+on\s*;', paths: ['**/nginx.conf', '**/conf.d/**', '**/sites-enabled/**'], file_types: [text], tags: [web], description: 响应头暴露 Nginx 版本，便于攻击者匹配已知漏洞。, remediation: 设置 server_tokens off。}
  - {id: CONF-021, title: Web 静态目录映射到文件系统根, severity: high, scene: Web 服务配置, match_type: regex, pattern: '(?i)^\s*alias\s+/\s*;', paths: ['**/nginx.conf', '**/conf.d/**', '**/sites-enabled/**'], file_types: [text], tags: [web], description: 静态别名指向根路径，可能导致任意文件读取或目录遍历。, remediation: 将别名限制在独立静态目录，并禁止访问系统路径。}
  - {id: CONF-022, title: Apache 开启目录索引, severity: medium, scene: Web 服务配置, match_type: regex, pattern: '(?i)^\s*Options\s+.*\bIndexes\b', paths: ['**/httpd.conf', '**/apache2.conf', '**/.htaccess', '**/sites-enabled/**'], file_types: [text], tags: [web], description: Apache 开启目录索引，可枚举 Web 目录中的敏感文件。, remediation: 移除此配置并关闭目录浏览功能。}
  - {id: CONF-023, title: Apache 暴露 server-status 页面, severity: medium, scene: Web 服务配置, match_type: regex, pattern: '(?i)^\s*SetHandler\s+server-status', paths: ['**/httpd.conf', '**/apache2.conf', '**/conf.d/**'], file_types: [text], tags: [web], description: server-status 暴露连接与请求信息，可能辅助攻击者侦察。, remediation: 删除状态页配置，或仅允许本机受限访问。}
  - {id: CONF-024, title: PHP 开启详细错误显示, severity: medium, scene: Web 服务配置, match_type: regex, pattern: '(?i)^\s*display_errors\s*=\s*On\s*$', paths: ['**/php.ini', '**/conf.d/**'], file_types: [text], tags: [web], description: PHP 错误详情可能泄露路径、配置与数据库信息。, remediation: 生产环境设置 display_errors=Off 并记录到受保护日志。}
  - {id: CONF-025, title: PHP 暴露版本信息, severity: low, scene: Web 服务配置, match_type: regex, pattern: '(?i)^\s*expose_php\s*=\s*On\s*$', paths: ['**/php.ini', '**/conf.d/**'], file_types: [text], tags: [web], description: PHP 响应头泄露版本信息，便于攻击者选择利用方式。, remediation: 设置 expose_php=Off。}
  - {id: CONF-026, title: Web 跨域策略允许任意来源, severity: high, scene: Web 服务配置, match_type: regex, pattern: '(?i)Access-Control-Allow-Origin\s*[:=]\s*["'']?\*', paths: ['**/nginx.conf', '**/httpd.conf', '**/apache2.conf', '**/.htaccess', '**/conf.d/**'], file_types: [text], tags: [web], description: CORS 允许任意来源，可能使恶意网页读取设备接口数据。, remediation: 配置明确的可信来源白名单，避免使用通配符。}
  - {id: CONF-027, title: Web 应用开启调试模式, severity: high, scene: Web 应用配置, match_type: regex, pattern: '(?i)^\s*(?:APP_DEBUG|DEBUG)\s*=\s*(?:true|1|on)\s*$', paths: ['**/.env', '**/config.php', '**/settings.ini', '**/conf.d/**'], file_types: [text], tags: [web], description: 生产固件开启调试模式，可能暴露堆栈、配置与内部接口。, remediation: 关闭调试模式并移除开发配置文件。}
  - {id: CONF-028, title: Web 根目录保留默认管理后台, severity: medium, scene: Web 目录, match_type: path, pattern: '**/www/admin/**', paths: ['**/www/admin/**', '**/htdocs/admin/**', '**/webroot/admin/**'], tags: [web], description: Web 根目录存在默认管理后台目录，可能使用默认口令。, remediation: 删除默认后台或修改入口路径，启用强认证与访问限制。}
